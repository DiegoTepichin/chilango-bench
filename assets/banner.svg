<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <rect width="900" height="200" rx="12" fill="url(#grid)"/>

  <!-- Left accent bar (CDMX Metro lines) -->
  <rect x="40" y="32" width="6" height="3" rx="1.5" fill="#F05A28"/>
  <rect x="50" y="32" width="6" height="3" rx="1.5" fill="#008080"/>
  <rect x="60" y="32" width="6" height="3" rx="1.5" fill="#E6007E"/>
  <rect x="70" y="32" width="6" height="3" rx="1.5" fill="#F49320"/>
  <rect x="80" y="32" width="6" height="3" rx="1.5" fill="#00AEEF"/>
  <rect x="90" y="32" width="6" height="3" rx="1.5" fill="#71BF44"/>

  <!-- LLM BENCHMARK badge -->
  <rect x="40" y="42" width="130" height="20" rx="10" fill="#FF007F" fill-opacity="0.12" stroke="#FF007F" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="54" cy="52" r="3" fill="#00E5FF"/>
  <text x="63" y="56" fill="#00E5FF" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">LLM BENCHMARK</text>

  <!-- Main title -->
  <text x="40" y="110" fill="url(#titleGrad)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5">chilango-bench</text>

  <!-- Subtitle -->
  <text x="40" y="138" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Mexican Spanish benchmark for LLMs · Slang · Cultural Context · Procedures · Albur</text>

  <!-- Feature pills row -->
  <!-- Pill 1 -->
  <rect x="40" y="158" width="108" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="53" cy="170" r="3.5" fill="#FF5722"/>
  <text x="62" y="174" fill="#e2e8f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Chilangismos</text>

  <!-- Pill 2 -->
  <rect x="158" y="158" width="128" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="171" cy="170" r="3.5" fill="#00E5FF"/>
  <text x="180" y="174" fill="#e2e8f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Contexto Cultural</text>

  <!-- Pill 3 -->
  <rect x="296" y="158" width="124" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="309" cy="170" r="3.5" fill="#E6007E"/>
  <text x="318" y="174" fill="#e2e8f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Trámites y SAT</text>

  <!-- Pill 4 -->
  <rect x="430" y="158" width="112" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="443" cy="170" r="3.5" fill="#10B981"/>
  <text x="452" y="174" fill="#e2e8f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Doble Sentido</text>

  <!-- Pill 5 -->
  <rect x="552" y="158" width="112" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="565" cy="170" r="3.5" fill="#F59E0B"/>
  <text x="574" y="174" fill="#e2e8f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">100% Offline CI</text>

  <!-- Right version badge -->
  <rect x="800" y="82" width="66" height="26" rx="13" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
  <text x="833" y="99" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">v0.1</text>

  <!-- Border -->
  <rect width="900" height="200" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
