<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Neon Accents Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="45%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="subtleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.25" />
    </linearGradient>

    <radialGradient id="meshCenter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.03); }
    }
    @keyframes floatTag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pulsing-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-badge {
      animation: floatTag 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#202b3d" stroke-width="1.5" />
  <rect width="100%" height="100%" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="80" r="140" fill="url(#meshCenter)" class="pulsing-glow" />
  <circle cx="720" cy="160" r="160" fill="url(#meshCenter)" class="pulsing-glow" />

  <!-- Metro Line Accent Bar (CDMX Subway lines homage) -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="8" height="4" rx="2" fill="#F05A28" />
    <rect x="12" y="0" width="8" height="4" rx="2" fill="#008080" />
    <rect x="24" y="0" width="8" height="4" rx="2" fill="#E6007E" />
    <rect x="36" y="0" width="8" height="4" rx="2" fill="#F49320" />
    <rect x="48" y="0" width="8" height="4" rx="2" fill="#00AEEF" />
    <rect x="60" y="0" width="8" height="4" rx="2" fill="#71BF44" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 48)">
    <rect x="0" y="0" width="136" height="22" rx="11" fill="#FF007F" fill-opacity="0.12" stroke="#FF007F" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#00E5FF" />
    <text x="24" y="15" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LLM BENCHMARK</text>
  </g>

  <!-- Main Title -->
  <text x="40" y="118" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    chilango-bench
  </text>

  <!-- Subtitle -->
  <text x="40" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    The rigorous Mexican Spanish benchmark for LLMs: Slang, Cultural Context, Procedures &amp; Albur
  </text>

  <!-- Feature Pills -->
  <g transform="translate(40, 185)">
    <!-- Pill 1: Slang -->
    <g transform="translate(0, 0)">
      <rect width="112" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#FF5722" />
      <text x="26" y="18" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Chilangismos</text>
    </g>

    <!-- Pill 2: Culture -->
    <g transform="translate(122, 0)">
      <rect width="134" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#00E5FF" />
      <text x="26" y="18" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Contexto Cultural</text>
    </g>

    <!-- Pill 3: Procedures -->
    <g transform="translate(266, 0)">
      <rect width="136" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#E6007E" />
      <text x="26" y="18" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Trámites y SAT</text>
    </g>

    <!-- Pill 4: Albur -->
    <g transform="translate(412, 0)">
      <rect width="128" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="26" y="18" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Doble Sentido</text>
    </g>

    <!-- Pill 5: Offline First -->
    <g transform="translate(550, 0)">
      <rect width="118" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#F59E0B" />
      <text x="26" y="18" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">100% Offline CI</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Badge -->
  <g transform="translate(730, 48)" class="floating-badge">
    <circle cx="50" cy="50" r="44" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <path d="M 32 60 L 50 34 L 68 60 Z" fill="none" stroke="#FF007F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="52" r="5" fill="#00E5FF" />
    <text x="50" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">v0.1 SHIP</text>
  </g>
</svg>
