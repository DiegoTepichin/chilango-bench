<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="490">
  <defs>
    <!-- Terminal Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glass Header Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#151e2e" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00E5FF" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typeCommand {
      0% { width: 0; }
      15% { width: 620px; }
      100% { width: 620px; }
    }
    @keyframes showOutput1 {
      0%, 16% { opacity: 0; transform: translateY(4px); }
      22%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showOutput2 {
      0%, 30% { opacity: 0; transform: translateY(4px); }
      36%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fillProgress {
      0%, 22% { width: 0px; }
      32%, 100% { width: 280px; }
    }
    @keyframes showResults {
      0%, 38% { opacity: 0; transform: translateY(6px); }
      46%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showFooter {
      0%, 54% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }

    .cursor {
      animation: blink 1s infinite;
    }
    .typing-box {
      overflow: hidden;
      white-space: nowrap;
      animation: typeCommand 12s infinite;
    }
    .step-1 {
      animation: showOutput1 12s infinite;
    }
    .progress-fill {
      animation: fillProgress 12s infinite;
    }
    .step-2 {
      animation: showOutput2 12s infinite;
    }
    .results-card {
      animation: showResults 12s infinite;
    }
    .footer-line {
      animation: showFooter 12s infinite;
    }
  </style>

  <!-- Window Container with Shadow -->
  <g filter="url(#softGlow)">
    <rect x="25" y="20" width="800" height="450" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1.2" />

    <!-- Title Bar -->
    <rect x="25" y="20" width="800" height="38" rx="12" fill="url(#headerBg)" />
    <!-- Bottom line to square off top rounded rect -->
    <rect x="25" y="46" width="800" height="12" fill="url(#headerBg)" />
    <line x1="25" y1="58" x2="825" y2="58" stroke="#334155" stroke-width="1" />

    <!-- macOS Window Buttons -->
    <circle cx="48" cy="39" r="6" fill="#ef4444" />
    <circle cx="68" cy="39" r="6" fill="#f59e0b" />
    <circle cx="88" cy="39" r="6" fill="#10b981" />

    <!-- Title Bar Text -->
    <text x="425" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">
      chilango-bench — eval execution
    </text>
  </g>

  <!-- Terminal Content Area -->
  <g transform="translate(50, 90)" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13">
    <!-- Prompt & Command Line -->
    <g>
      <text x="0" y="0" fill="#00E5FF" font-weight="700">➜</text>
      <text x="20" y="0" fill="#a855f7" font-weight="600">chilango-bench</text>
      <text x="145" y="0" fill="#64748b">git:(</text>
      <text x="180" y="0" fill="#ef4444">main</text>
      <text x="210" y="0" fill="#64748b">)</text>
      <text x="225" y="0" fill="#f1f5f9">$</text>
    </g>

    <!-- Command Typed with Animation -->
    <g transform="translate(242, -13)">
      <svg width="600" height="24">
        <g class="typing-box">
          <text x="0" y="13" fill="#f8fafc" font-family="'SF Mono', Menlo, monospace" font-size="13">
            uv run chilango-bench eval -d datasets/v0.1/seed.jsonl -m llama-3.3-70b
          </text>
        </g>
      </svg>
    </g>

    <!-- Step 1: Initial Log Output -->
    <g transform="translate(0, 32)" class="step-1">
      <text x="0" y="0" fill="#94a3b8">⚡ Initializing OpenAIRunner for target:</text>
      <text x="345" y="0" fill="#38bdf8" font-weight="700">llama-3.3-70b</text>
      <text x="0" y="24" fill="#94a3b8">📦 Loaded </text>
      <text x="75" y="24" fill="#10b981" font-weight="700">40 items</text>
      <text x="148" y="24" fill="#94a3b8"> from datasets/v0.1/seed.jsonl</text>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(0, 86)" class="step-2">
      <text x="0" y="0" fill="#64748b">Evaluating items:</text>
      <!-- Track -->
      <rect x="140" y="-10" width="280" height="12" rx="6" fill="#1e293b" />
      <!-- Animated Fill -->
      <rect x="140" y="-10" width="0" height="12" rx="6" fill="url(#barGrad)" class="progress-fill" />
      <text x="432" y="0" fill="#10b981" font-weight="600">100% (40/40)</text>
    </g>

    <!-- Results Card -->
    <g transform="translate(0, 114)" class="results-card">
      <rect x="0" y="0" width="750" height="180" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1.2" />

      <!-- Card Header -->
      <text x="24" y="28" fill="#FF007F" font-weight="700" letter-spacing="1">================ BENCHMARK RESULTS ================</text>
      <text x="24" y="56" fill="#94a3b8">Target Model :</text>
      <text x="145" y="56" fill="#ffffff" font-weight="700">llama-3.3-70b</text>

      <text x="24" y="80" fill="#94a3b8">Overall Score:</text>
      <text x="145" y="80" fill="#00E5FF" font-weight="700">82.50%</text>
      <text x="206" y="80" fill="#64748b">(33 / 40 correct)</text>

      <!-- Category Columns -->
      <text x="24" y="112" fill="#64748b">Breakdown by Category:</text>
      <g transform="translate(24, 134)">
        <text x="0" y="0" fill="#f1f5f9">• slang:</text>
        <text x="75" y="0" fill="#10b981" font-weight="700">90.0%</text>

        <text x="150" y="0" fill="#f1f5f9">• cultural_context:</text>
        <text x="305" y="0" fill="#10b981" font-weight="700">80.0%</text>

        <text x="380" y="0" fill="#f1f5f9">• procedures:</text>
        <text x="495" y="0" fill="#10b981" font-weight="700">90.0%</text>

        <text x="565" y="0" fill="#f1f5f9">• albur:</text>
        <text x="630" y="0" fill="#f59e0b" font-weight="700">70.0%</text>
      </g>

      <!-- Latency & Tokens Stats -->
      <text x="24" y="162" fill="#64748b">Latency:</text>
      <text x="95" y="162" fill="#94a3b8">0.142s/req (Total: 5.68s)</text>
      <text x="320" y="162" fill="#64748b">Tokens:</text>
      <text x="385" y="162" fill="#94a3b8">640 prompt, 192 completion</text>
    </g>

    <!-- Footer Line -->
    <g transform="translate(0, 320)" class="footer-line">
      <text x="0" y="0" fill="#10b981">✔</text>
      <text x="18" y="0" fill="#94a3b8">Report artifact saved to:</text>
      <text x="218" y="0" fill="#f1f5f9" text-decoration="underline">results/llama-3.3-70b.json</text>

      <!-- New Terminal Line with Blinking Cursor -->
      <text x="0" y="32" fill="#00E5FF" font-weight="700">➜</text>
      <text x="20" y="32" fill="#a855f7" font-weight="600">chilango-bench</text>
      <text x="145" y="32" fill="#f1f5f9">$</text>
      <rect x="162" y="20" width="8" height="15" fill="#00E5FF" class="cursor" />
    </g>
  </g>
</svg>
