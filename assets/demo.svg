<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#151e2e"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Window shadow -->
  <rect x="28" y="24" width="804" height="374" rx="12" fill="#000000" fill-opacity="0.4"/>

  <!-- Window frame -->
  <rect x="24" y="20" width="812" height="376" rx="12" fill="url(#winBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Title bar -->
  <rect x="24" y="20" width="812" height="40" rx="12" fill="url(#headerBg)"/>
  <rect x="24" y="48" width="812" height="12" fill="#151e2e"/>
  <line x1="24" y1="60" x2="836" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS traffic lights -->
  <circle cx="48" cy="40" r="6" fill="#ef4444"/>
  <circle cx="68" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="40" r="6" fill="#10b981"/>

  <!-- Window title -->
  <text x="430" y="45" fill="#64748b" font-family="'SF Mono', 'Segoe UI', Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle">chilango-bench — eval</text>

  <!-- ── Terminal Content ── -->
  <g font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13">

    <!-- Line 1: prompt + command -->
    <text x="48" y="96" fill="#00E5FF" font-weight="700">➜</text>
    <text x="66" y="96" fill="#a855f7" font-weight="600">chilango-bench</text>
    <text x="190" y="96" fill="#64748b"> git:(</text>
    <text x="235" y="96" fill="#ef4444">main</text>
    <text x="263" y="96" fill="#64748b">)</text>
    <text x="276" y="96" fill="#f1f5f9"> $ uv run chilango-bench eval \</text>

    <!-- Line 2: command continuation -->
    <text x="48" y="116" fill="#64748b">     </text>
    <text x="68" y="116" fill="#f1f5f9">--dataset datasets/v0.1/seed.jsonl --model llama-3.3-70b</text>

    <!-- Line 3: blank -->

    <!-- Line 4: init log -->
    <text x="48" y="148" fill="#64748b">⚡</text>
    <text x="66" y="148" fill="#94a3b8">Initializing OpenAIRunner · target:</text>
    <text x="322" y="148" fill="#38bdf8" font-weight="600">llama-3.3-70b</text>

    <!-- Line 5: dataset loaded -->
    <text x="48" y="168" fill="#64748b">📦</text>
    <text x="66" y="168" fill="#94a3b8">Loaded</text>
    <text x="112" y="168" fill="#10b981" font-weight="600">40 items</text>
    <text x="170" y="168" fill="#94a3b8">from datasets/v0.1/seed.jsonl</text>

    <!-- Line 6: progress bar -->
    <text x="48" y="196" fill="#64748b">Evaluating</text>
    <!-- track -->
    <rect x="136" y="183" width="280" height="12" rx="6" fill="#1e293b"/>
    <!-- fill (static, shown as complete) -->
    <rect x="136" y="183" width="280" height="12" rx="6" fill="url(#barFill)"/>
    <text x="428" y="196" fill="#10b981" font-weight="600">100%  40/40</text>

    <!-- Results card -->
    <rect x="48" y="214" width="764" height="148" rx="8" fill="#0d1523" stroke="#1e293b" stroke-width="1.2"/>

    <text x="72" y="242" fill="#FF007F" font-weight="700" letter-spacing="0.5">═══════════════ BENCHMARK RESULTS ═══════════════</text>

    <text x="72" y="268" fill="#64748b">Target Model :</text>
    <text x="184" y="268" fill="#f1f5f9" font-weight="700">llama-3.3-70b</text>

    <text x="72" y="290" fill="#64748b">Overall Score:</text>
    <text x="184" y="290" fill="#00E5FF" font-weight="700">85.00%</text>
    <text x="248" y="290" fill="#64748b">(34 / 40 correct)</text>

    <text x="72" y="316" fill="#64748b">Category breakdown:</text>

    <!-- Categories row -->
    <text x="72" y="338" fill="#94a3b8">slang</text>
    <text x="118" y="338" fill="#10b981" font-weight="600">90.0%</text>

    <text x="188" y="338" fill="#94a3b8">cultural</text>
    <text x="246" y="338" fill="#10b981" font-weight="600">90.0%</text>

    <text x="316" y="338" fill="#94a3b8">procedures</text>
    <text x="398" y="338" fill="#10b981" font-weight="600">90.0%</text>

    <text x="468" y="338" fill="#94a3b8">albur</text>
    <text x="506" y="338" fill="#f59e0b" font-weight="600">70.0%</text>

    <text x="576" y="338" fill="#64748b">latency</text>
    <text x="626" y="338" fill="#94a3b8">0.18s/req</text>

    <!-- Line: saved report -->
    <text x="48" y="384" fill="#10b981">✔</text>
    <text x="66" y="384" fill="#94a3b8">Report saved →</text>
    <text x="172" y="384" fill="#f1f5f9">results/llama-3.3-70b.json</text>

    <!-- New prompt line -->
    <text x="48" y="406" fill="#00E5FF" font-weight="700">➜</text>
    <text x="66" y="406" fill="#a855f7" font-weight="600">chilango-bench</text>
    <text x="190" y="406" fill="#64748b"> git:(</text>
    <text x="235" y="406" fill="#ef4444">main</text>
    <text x="263" y="406" fill="#64748b">)</text>
    <text x="276" y="406" fill="#f1f5f9"> $</text>
    <rect x="300" y="394" width="8" height="14" rx="1" fill="#00E5FF" fill-opacity="0.9"/>
  </g>

  <!-- Window border -->
  <rect x="24" y="20" width="812" height="376" rx="12" fill="none" stroke="#1e293b" stroke-width="1.2"/>
</svg>
