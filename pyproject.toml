[project]
name = "chilango-bench"
version = "1.0.0"
description = "A benchmark of large language models on Mexican Spanish nuances, slang, cultural context, and wordplay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Diego Tepichin", email = "215420898+DiegoTepichin@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
chilango-bench = "chilango_bench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chilango_bench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "ANN", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
